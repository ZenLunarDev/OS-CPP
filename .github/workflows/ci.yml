name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (nasm, qemu, 32-bit host fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 gcc-multilib
          # ไม่มี i686-elf-gcc บน runner → toolchain file จะ fallback เป็น host gcc -m32 เอง

      - name: Build kernel
        run: |
          set -o pipefail
          cmake -B build -G "Unix Makefiles" 2>&1 | tee /tmp/configure.log
          if ! cmake --build build 2>&1 | tee /tmp/build.log; then
            {
              echo "### Configure log (tail)"
              echo '```'
              tail -40 /tmp/configure.log
              echo '```'
              echo "### Build log (tail)"
              echo '```'
              tail -60 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: QEMU smoke test (13 commands via QMP keyboard)
        run: |
          python3 tools/smoke_test.py
