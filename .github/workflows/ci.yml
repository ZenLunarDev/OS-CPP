name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (nasm, qemu, 32-bit host fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 gcc-multilib
          # ไม่มี i686-elf-gcc บน runner → toolchain file จะ fallback เป็น host gcc -m32 เอง

      - name: Build kernel
        run: |
          set -o pipefail
          cmake -B build -G "Unix Makefiles" 2>&1 | tee /tmp/configure.log
          cmake --build build --verbose 2>&1 | tee /tmp/build.log

      # ผ่าน API อ่าน annotation ได้โดยไม่ต้อง auth — ใส่ log tail ไว้ในนั้นเพื่อ debug
      - name: Annotate failure with log tail
        if: failure()
        run: |
          # annotation จำกัด ~4KB — เล็กลงและแยกเป็นหลายก้อน
          python3 - <<'EOF'
          import urllib.parse, re
          def grab(path, cap):
              try:
                  return open(path, 'rb').read().decode(errors='replace')[-cap:]
              except Exception as e:
                  return f'(no log: {e})'
          for label, path, mode, cap in [
              ('nasm cmd', '/tmp/build.log', 'regex', 300),
              ('build tail', '/tmp/build.log', 'tail', 1800),
              ('configure tail', '/tmp/configure.log', 'tail', 800),
              ('smoke tail', '/tmp/smoke.log', 'tail', 1800),
              ('serial tail', 'meow_serial.log', 'tail', 1800),
          ]:
              if mode == 'regex':
                  bld = grab('/tmp/build.log', 120000)
                  m = re.search(r'nasm[^\n]*interrupts', bld)
                  chunk = m.group(0) if m else '(nasm cmd not found)'
              else:
                  chunk = grab(path, cap)
              print(f'::error::{label}: ' + urllib.parse.quote(chunk, safe=''))
          EOF

      - name: QEMU smoke test (13 commands via QMP keyboard)
        if: success()
        run: |
          set -o pipefail
          python3 tools/smoke_test.py 2>&1 | tee /tmp/smoke.log
